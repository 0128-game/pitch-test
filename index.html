<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>音程トレーニングゲーム</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; color: #333; }
    h1, h2 { text-align: center; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .hidden { display: none; }
    button { padding: 10px 15px; margin: 5px; font-size: 16px; cursor: pointer; border-radius: 5px; border: 1px solid #ccc; background: #eef; }
    button:hover { background: #dde; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    select { padding: 8px; font-size: 16px; margin-bottom: 10px; }
    .status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; color: white; margin-left: 10px; }
    .status-未開放 { background: #888; }
    .status-未プレイ { background: #aaa; }
    .status-不合格 { background: #e53935; }
    .status-合格 { background: #43a047; }
    .status-パーフェクト { background: #fdd835; color: #333; font-weight: bold; }
    
    /* 簡易鍵盤スタイル */
    .keyboard-container { display: flex; justify-content: center; margin: 20px 0; position: relative; height: 120px; }
    .key { border: 1px solid #333; position: relative; box-sizing: border-box; }
    .white-key { width: 35px; height: 120px; background: white; border-radius: 0 0 5px 5px; }
    .black-key { width: 22px; height: 75px; background: #333; position: absolute; top: 0; z-index: 2; border-radius: 0 0 3px 3px; }
    .key.active { background: #ffeb3b !important; }
    .key-label { position: absolute; bottom: 5px; width: 100%; text-align: center; font-size: 10px; }
    
    .question-box { font-size: 24px; text-align: center; margin: 20px 0; font-weight: bold; }
    .timer { font-size: 18px; text-align: center; color: #e53935; margin-bottom: 10px; }
    .btn-group { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    .btn-group button.selected { background: #007bff; color: white; border-color: #0056b3; }
  </style>
</head>
<body>

  <h1>音程トレーニングゲーム</h1>

  <!-- 設定画面 -->
  <div id="settings-screen" class="card">
    <h2>設定</h2>
    <div>
      <label>音階表示方法: </label>
      <select id="notation-setting">
        <option value="doremi">ドレミ (♯/♭)</option>
        <option value="cde">CDE (♯/♭)</option>
        <option value="haniho">ハニホ (嬰/変)</option>
      </select>
    </div>
    <div>
      <label>鍵盤表示: </label>
      <select id="keyboard-setting">
        <option value="highlight">指示された部分を光らせる</option>
        <option value="show">鍵盤表示させるだけ</option>
        <option value="hide">表示させない</option>
      </select>
    </div>
    <div>
      <label>問題解答時間: </label>
      <select id="time-setting">
        <option value="2">超ギリギリ(2秒)</option>
        <option value="3">ギリギリ(3秒)</option>
        <option value="5" selected>速め(5秒)</option>
        <option value="10">普通(10秒)</option>
        <option value="20">長め(20秒)</option>
      </select>
    </div>
  </div>

  <!-- レベル選択画面 -->
  <div id="level-screen" class="card">
    <h2>ステージ選択</h2>
    <div id="level-list"></div>
  </div>

  <!-- ゲーム画面 -->
  <div id="game-screen" class="card hidden">
    <div style="display:flex; justify-content:space-between;">
      <span id="question-count">1 / 10問目</span>
      <span id="current-time-setting-display"></span>
    </div>
    
    <div class="timer" id="timer-display">残り時間: --</div>
    <div class="question-box" id="question-display"></div>

    <!-- 鍵盤表示エリア -->
    <div id="keyboard-wrapper" class="keyboard-container"></div>

    <!-- 解答エリア -->
    <div style="text-align: center;">
      <p>ステップ1: 種別を選択</p>
      <div class="btn-group" id="type-buttons">
        <button onclick="selectType('完全')">完全</button>
        <button onclick="selectType('長')">長</button>
        <button onclick="selectType('短')">短</button>
        <button onclick="selectType('増')">増</button>
        <button onclick="selectType('減')">減</button>
      </div>

      <p>ステップ2: 度数を選択</p>
      <div class="btn-group" id="degree-buttons">
        <button onclick="selectDegree(1)">1度</button>
        <button onclick="selectDegree(2)">2度</button>
        <button onclick="selectDegree(3)">3度</button>
        <button onclick="selectDegree(4)">4度</button>
        <button onclick="selectDegree(5)">5度</button>
        <button onclick="selectDegree(6)">6度</button>
        <button onclick="selectDegree(7)">7度</button>
        <button onclick="selectDegree(8)">8度</button>
      </div>

      <div style="margin-top: 20px;">
        <p>選択中: <strong id="selected-answer">---</strong></p>
        <button onclick="submitAnswer()" id="submit-btn" disabled style="background:#28a745; color:white;">回答する</button>
      </div>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="result-screen" class="card hidden" style="text-align: center;">
    <h2>結果発表</h2>
    <p id="result-text" style="font-size: 24px; font-weight: bold;"></p>
    <p id="result-detail"></p>
    <button onclick="backToMenu()">ステージ一覧へ戻る</button>
  </div>

<script>
// 音の基本データ定義 (0: C, 1: C#/Db, ... 11: B)
const NOTE_NAMES = {
  doremi: ["ド", "ド♯", "レ", "レ♯", "ミ", "ファ", "ファ♯", "ソ", "ソ♯", "ラ", "ラ♯", "シ"],
  cde:    ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"],
  haniho: ["ハ", "嬰ハ", "ニ", "嬰ニ", "ホ", "ヘ", "嬰ヘ", "ト", "嬰ト", "イ", "嬰イ", "ロ"]
};

// 鍵盤表示用 (2オクターブ分)
const WHITE_KEYS = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24]; // C4~C6
const BLACK_KEYS = [
  { pitch: 1, left: 23 }, { pitch: 3, left: 58 },
  { pitch: 6, left: 128 }, { pitch: 8, left: 163 }, { pitch: 10, left: 198 },
  { pitch: 13, left: 268 }, { pitch: 15, left: 303 },
  { pitch: 18, left: 373 }, { pitch: 20, left: 408 }, { pitch: 22, left: 443 }
];

// 正解データの半音数マッピング
const INTERVAL_SEMITONES = {
  "完全1度": 0, "短2度": 1, "長2度": 2, "増1度": 1, "減2度": 0,
  "短3度": 3, "長3度": 4, "増2度": 3, "減3度": 2,
  "完全4度": 5, "増3度": 5, "減4度": 4,
  "増4度": 6, "減5度": 6,
  "完全5度": 7, "増5度": 8, "減6度": 7,
  "短6度": 8, "長6度": 9, "増6度": 10, "減7度": 9,
  "短7度": 10, "長7度": 11, "増7度": 12, "減8度": 11,
  "完全8度": 12, "増8度": 13
};

let currentLevel = 1;
let currentQuestionIndex = 0;
let score = 0;
let questions = [];
let timer = null;
let timeLeft = 0;
let selectedType = "";
let selectedDegree = null;

// localStorage からクリア状態を取得
function getProgressData() {
  const data = localStorage.getItem('interval_game_progress');
  return data ? JSON.parse(data) : {};
}

function saveProgressData(data) {
  localStorage.setItem('interval_game_progress', JSON.stringify(data));
}

// 画面切り替え
function showScreen(screenId) {
  ['settings-screen', 'level-screen', 'game-screen', 'result-screen'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
  document.getElementById(screenId).classList.remove('hidden');
}

// レベル一覧の描画
function renderLevels() {
  const progress = getProgressData();
  const timeSetting = document.getElementById('time-setting').value;
  const container = document.getElementById('level-list');
  container.innerHTML = "";

  for (let lvl = 1; lvl <= 7; lvl++) {
    const key = `lvl_${lvl}_time_${timeSetting}`;
    let status = progress[key] || (lvl === 1 ? "未プレイ" : "未開放");
    
    // 直前のレベルで解放条件（5秒以下設定で8問以上正解＝合格/パーフェクト）を満たしているか判定
    if (lvl > 1) {
      const prevKeyFast = `lvl_${lvl-1}_time_5`;
      const prevKeySFast = `lvl_${lvl-1}_time_3`;
      const prevKeySSFast = `lvl_${lvl-1}_time_2`;
      const prevPassed = [prevKeyFast, prevKeySFast, prevKeySSFast].some(k => progress[k] === "合格" || progress[k] === "パーフェクト");
      if (!prevPassed && status === "未開放") {
        status = "未開放";
      } else if (status === "未開放") {
        status = "未プレイ";
      }
    }

    const div = document.createElement('div');
    div.style.margin = "10px 0";
    div.innerHTML = `
      <span>レベル ${lvl}</span>
      <span class="status-badge status-${status}">${status}</span>
      <button onclick="startGame(${lvl})" ${status === "未開放" ? "disabled" : ""}>スタート</button>
    `;
    container.appendChild(div);
  }
}

// 問題生成ロジック
function generateQuestions(level) {
  const list = [];
  const whitePitchList = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24];
  
  // 各レベルごとの対象音程パターン
  let pool = [];
  if (level >= 1) pool.push("完全4度", "完全5度");
  if (level >= 2) pool.push("長2度", "短2度", "長3度", "短3度");
  if (level >= 3) pool.push("増4度", "減5度");
  if (level >= 4) pool.push("長6度", "短6度", "長7度", "短7度");
  if (level >= 5) pool.push("完全1度", "完全8度");
  if (level >= 7) pool.push("増1度", "減2度", "増2度", "減3度", "増3度", "減4度", "増5度", "減6度", "増6度", "減7度", "増7度", "減8度", "増8度");

  for (let i = 0; i < 10; i++) {
    const targetInterval = pool[Math.floor(Math.random() * pool.length)];
    const semitones = INTERVAL_SEMITONES[targetInterval];

    let root, next;
    let attempts = 0;
    while (attempts < 100) {
      attempts++;
      if (level <= 5) {
        // 白鍵のみ
        root = whitePitchList[Math.floor(Math.random() * (whitePitchList.length - 8))];
        next = root + semitones;
        if (whitePitchList.includes(next)) break;
      } else {
        // 黒鍵を含む
        root = Math.floor(Math.random() * 13); // C4~C5スタート
        next = root + semitones;
        break;
      }
    }

    list.push({ root, next, answer: targetInterval });
  }
  return list;
}

// ゲーム開始
function startGame(level) {
  currentLevel = level;
  currentQuestionIndex = 0;
  score = 0;
  questions = generateQuestions(level);
  
  showScreen('game-screen');
  nextQuestion();
}

// 次の問題
function nextQuestion() {
  if (currentQuestionIndex >= 10) {
    endGame();
    return;
  }

  resetAnswerSelection();
  const q = questions[currentQuestionIndex];
  document.getElementById('question-count').innerText = `${currentQuestionIndex + 1} / 10問目`;
  
  const notation = document.getElementById('notation-setting').value;
  const rootName = getNoteName(q.root, notation);
  const nextName = getNoteName(q.next, notation);
  
  document.getElementById('question-display').innerText = `${rootName} と ${nextName} の音程は？`;

  renderKeyboard(q.root, q.next);
  startTimer();
}

function getNoteName(pitch, notation) {
  const index = pitch % 12;
  const octave = Math.floor(pitch / 12) + 4;
  return NOTE_NAMES[notation][index] + (notation === 'cde' ? octave : '');
}

// 鍵盤描画
function renderKeyboard(root, next) {
  const kbMode = document.getElementById('keyboard-setting').value;
  const wrapper = document.getElementById('keyboard-wrapper');
  wrapper.innerHTML = "";

  if (kbMode === 'hide') return;

  WHITE_KEYS.forEach(p => {
    const key = document.createElement('div');
    key.className = 'key white-key';
    if (kbMode === 'highlight' && (p === root || p === next)) {
      key.classList.add('active');
    }
    wrapper.appendChild(key);
  });

  BLACK_KEYS.forEach(b => {
    const key = document.createElement('div');
    key.className = 'key black-key';
    key.style.left = b.left + 'px';
    if (kbMode === 'highlight' && (b.pitch === root || b.pitch === next)) {
      key.classList.add('active');
    }
    wrapper.appendChild(key);
  });
}

// タイマー処理
function startTimer() {
  clearInterval(timer);
  const timeLimit = parseInt(document.getElementById('time-setting').value, 10);
  timeLeft = timeLimit;
  
  const timerDisplay = document.getElementById('timer-display');
  timerDisplay.innerText = `残り時間: ${timeLeft}秒`;

  timer = setInterval(() => {
    timeLeft--;
    timerDisplay.innerText = `残り時間: ${timeLeft}秒`;
    if (timeLeft <= 0) {
      clearInterval(timer);
      submitAnswer(true); // 時間切れ自動判定
    }
  }, 1000);
}

// 回答選択ロジック
function selectType(type) {
  selectedType = type;
  updateSelectionUI('type-buttons', type);
}

function selectDegree(degree) {
  selectedDegree = degree;
  updateSelectionUI('degree-buttons', degree);
}

function updateSelectionUI(containerId, value) {
  const container = document.getElementById(containerId);
  const buttons = container.getElementsByTagName('button');
  for (let btn of buttons) {
    if (btn.innerText.includes(value)) {
      btn.classList.add('selected');
    } else {
      btn.classList.remove('selected');
    }
  }

  const selectedText = (selectedType && selectedDegree) ? `${selectedType}${selectedDegree}度` : '---';
  document.getElementById('selected-answer').innerText = selectedText;
  document.getElementById('submit-btn').disabled = !(selectedType && selectedDegree);
}

function resetAnswerSelection() {
  selectedType = "";
  selectedDegree = null;
  document.getElementById('selected-answer').innerText = '---';
  document.getElementById('submit-btn').disabled = true;
  document.querySelectorAll('.btn-group button').forEach(btn => btn.classList.remove('selected'));
}

// 回答提出
function submitAnswer(isTimeout = false) {
  clearInterval(timer);
  const q = questions[currentQuestionIndex];
  const userAnswer = isTimeout ? "時間切れ" : `${selectedType}${selectedDegree}度`;

  if (userAnswer === q.answer) {
    score++;
  }

  currentQuestionIndex++;
  nextQuestion();
}

// ゲーム終了・クリア判定保存
function endGame() {
  showScreen('result-screen');
  const timeSetting = parseInt(document.getElementById('time-setting').value, 10);
  
  let status = "不合格";
  if (score === 10) {
    status = "パーフェクト";
  } else if (score >= 8) {
    status = "合格";
  }

  // LocalStorageに保存
  const progress = getProgressData();
  const key = `lvl_${currentLevel}_time_${timeSetting}`;
  
  // より良い結果、あるいは既存結果の上書きロジック
  progress[key] = status;
  saveProgressData(progress);

  document.getElementById('result-text').innerText = `正解数: ${score} / 10問 (${status})`;
  document.getElementById('result-detail').innerText = (status === "合格" || status === "パーフェクト") 
    ? "おめでとうございます！条件を満たしました。" 
    : "残念！8問以上の正解を目指しましょう。";
}

function backToMenu() {
  renderLevels();
  showScreen('level-screen');
}

// イベントリスナーと初期化
document.getElementById('time-setting').addEventListener('change', renderLevels);
renderLevels();
</script>
</body>
</html>
