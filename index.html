<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>鍵盤判定アプリ</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* タイマー表示 */
    #timer-display {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #ffeb3b;
    }

    /* メッセージ表示 */
    #status-message {
      font-size: 1.2rem;
      height: 1.5em;
      margin-bottom: 20px;
      font-weight: bold;
    }

    /* 鍵盤コンテナ */
    .keyboard {
      display: flex;
      position: relative;
      background-color: #000;
      padding: 10px;
      border-radius: 8px;
    }

    /* 鍵盤の基本構造 */
    .key {
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    /* 白鍵 */
    .key.white {
      width: 50px;
      height: 200px;
      background: linear-gradient(to bottom, #fff 0%, #eee 100%);
      border: 1px solid #ccc;
      border-radius: 0 0 5px 5px;
      margin: 0 2px;
      z-index: 1;
    }

    /* 黒鍵 */
    .key.black {
      width: 30px;
      height: 120px;
      background: linear-gradient(to bottom, #333 0%, #000 100%);
      position: absolute;
      z-index: 2;
      border-radius: 0 0 3px 3px;
    }

    /* 黒鍵の位置調整 */
    .key[data-note="C#"] { left: 43px; }
    .key[data-note="D#"] { left: 97px; }
    .key[data-note="F#"] { left: 205px; }
    .key[data-note="G#"] { left: 259px; }
    .key[data-note="A#"] { left: 313px; }

    /* 選択時：オレンジ色の強力なグローエフェクト */
    .key.selected {
      background: #ff9800 !important;
      box-shadow: 0 0 20px #ff9800, 0 0 40px #ff9800 !important;
      border-color: #ffb74d !important;
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <div id="timer-display">残り時間: <span id="time">5</span> 秒</div>
  <div id="status-message">鍵盤を選んでください</div>

  <div class="keyboard" id="keyboard">
    <div class="key white" data-note="C"></div>
    <div class="key black" data-note="C#"></div>
    <div class="key white" data-note="D"></div>
    <div class="key black" data-note="D#"></div>
    <div class="key white" data-note="E"></div>
    <div class="key white" data-note="F"></div>
    <div class="key black" data-note="F#"></div>
    <div class="key white" data-note="G"></div>
    <div class="key black" data-note="G#"></div>
    <div class="key white" data-note="A"></div>
    <div class="key black" data-note="A#"></div>
    <div class="key white" data-note="B"></div>
  </div>

  <script>
    const INITIAL_TIME = 5;
    const CORRECT_NOTE = "E"; // 例として正解を「E」に設定

    let timeLeft = INITIAL_TIME;
    let timerId = null;
    let isAnswered = false;

    const timeElement = document.getElementById("time");
    const statusElement = document.getElementById("status-message");
    const keys = document.querySelectorAll(".key");

    // タイマー更新関数
    function updateTimerDisplay() {
      timeElement.textContent = timeLeft;
    }

    // タイマーリセット関数
    function resetTimer() {
      clearInterval(timerId);
      timeLeft = INITIAL_TIME;
      updateTimerDisplay();
    }

    // カウントダウン開始
    function startTimer() {
      resetTimer();
      timerId = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerId);
          handleTimeOut();
        }
      }, 1000);
    }

    // 時間切れ時の処理
    function handleTimeOut() {
      if (isAnswered) return;
      isAnswered = true;
      statusElement.textContent = "時間切れです！";
      statusElement.style.color = "#f44336";
      
      // 時間切れ時にタイマー表記を初期値に戻す
      resetTimer();
    }

    // 鍵盤クリック時の即時判定制御
    keys.forEach(key => {
      key.addEventListener("click", () => {
        if (isAnswered) return;

        // 答えた直後にタイマーを停止・初期値へリセット
        clearInterval(timerId);

        // 選択されたキーにオレンジグローを適用
        keys.forEach(k => k.classList.remove("selected"));
        key.classList.add("selected");

        const selectedNote = key.getAttribute("data-note");
        
        // 直ちに正解判定を行う
        if (selectedNote === CORRECT_NOTE) {
          statusElement.textContent = "正解です！ (" + selectedNote + ")";
          statusElement.style.color = "#4caf50";
        } else {
          statusElement.textContent = "不正解です！ (" + selectedNote + ")";
          statusElement.style.color = "#f44336";
        }

        isAnswered = true;
        
        // 判定後にタイマー数値をリセット状態に戻す
        resetTimer();
      });
    });

    // 初期化実行
    startTimer();
  </script>
</body>
</html>
